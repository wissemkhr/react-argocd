name: CI CD

on: 
  workflow_dispatch: 
  push:
    branches:
      - 'main'
      - 'feature/*'

jobs:
  unit_test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repositoy
        uses: actions/checkout@v7
      
      - name: Setup NodeJs
        uses: actions/setup-node@v6
      
      - name: cache dependecies
        uses: actions/cache@v6
        with:
          path: node_modules
          key: node_modules-${{ hashFiles('package.json') }}

      - name: Install Dependencies
        run: npm install 

      - name: Unit test
        run: npm run test
      
      - name: Upload The Unit Test Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit_test_report
          path: junit-report.xml

  code_coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repositoy
        uses: actions/checkout@v7
      
      - name: Setup NodeJs
        uses: actions/setup-node@v6

      - name: cache dependecies
        uses: actions/cache@v6
        with:
          path: node_modules
          key: node_modules-${{ hashFiles('package.json') }}

      - name: Install Dependencies
        run: npm install 

      - name: Code coverage
        continue-on-error: true
        run: npm run coverage
      
      - name: Upload The Coverage Report
        uses: actions/upload-artifact@v7
        with:
          name: coverage_report
          path: coverage

  docker:
    name: Docker
    needs: [unit_test, code_coverage]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repositoy
        uses: actions/checkout@v7
      
      - name: Docker Login
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      
      - name: Docker Build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: ${{ vars.DOCKERHUB_USERNAME }}/react-web-app:v1
        
      - name: List Docker Images
        run: docker images

      - name: Docker Test
        run: |
          docker run --name react-app -d -p 5173:5173  ${{ vars.DOCKERHUB_USERNAME }}/react-web-app:v1
          export IP=$(docker inspect -f '{{range.NetworkSettings.Networks}}{{.IPAddress}}{{end}}' react-app)
          echo $IP
          docker ps 
          docker run --rm alpine/curl http://$IP:5173/ | grep react-web-app

      - name: Docker Push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ vars.DOCKERHUB_USERNAME }}/react-web-app:v1
          
              